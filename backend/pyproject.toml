[project]
name = "backend"
version = "0.1.0"
description = "Serves published issues, page images, segment audio and the frontend behind a shared password."
requires-python = ">=3.14"
dependencies = [
    "hoerbote-shared",
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "python-dotenv>=1.2.0",
]

[tool.uv.sources]
# A path dependency, not a uv workspace: every project locks on its own.
hoerbote-shared = { path = "../shared" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # FastAPI's TestClient needs it.
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
