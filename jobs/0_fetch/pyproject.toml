[project]
name = "hoerbote-fetch"
version = "0.1.0"
description = "Fetch job: downloads one newspaper issue (PDF, per-page text, rights) into a new run dir."
requires-python = ">=3.14"
dependencies = [
    "hoerbote-shared",
    "httpx>=0.28.1",
]

[tool.uv.sources]
# A path dependency, not a uv workspace: every project locks on its own.
hoerbote-shared = { path = "../../shared" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
