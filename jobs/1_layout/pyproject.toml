[project]
name = "hoerbote-layout"
version = "0.1.0"
description = "Layout job: runs the layout-detection model over every page of an issue."
requires-python = ">=3.14"
dependencies = [
    "hoerbote-shared",
    "pillow>=10.2.0",
    "pymupdf>=1.28.2",
    "surya-ocr>=0.22.1",
]

[tool.uv.sources]
# A path dependency, not a uv workspace: every project locks on its own.
hoerbote-shared = { path = "../../shared" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
