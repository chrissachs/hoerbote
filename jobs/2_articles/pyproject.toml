[project]
name = "hoerbote-articles"
version = "0.1.0"
description = "Articles job: groups a page's text into articles, guided by the layout regions."
requires-python = ">=3.14"
dependencies = [
    "hoerbote-shared",
    "pillow>=10.2.0",
    "pymupdf>=1.28.2",
]

[tool.uv.sources]
# A path dependency, not a uv workspace: every project locks on its own.
hoerbote-shared = { path = "../../shared" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "viewer_template.html"]
