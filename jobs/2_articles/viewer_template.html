<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Article extraction — debug overview</title>
<style>
  :root {
    --col-0: #e6194b;
    --col-1: #3cb44b;
    --col-2: #4363d8;
    --col-3: #f58231;
    --col-4: #911eb4;
    --col-5: #46f0f0;
    --col-6: #f032e6;
    --col-7: #bcf60c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #2b2b2b;
    color: #eee;
  }
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: #1a1a1a;
    padding: 8px 12px;
    display: flex;
    gap: 16px;
    align-items: center;
    border-bottom: 1px solid #444;
    font-size: 13px;
  }
  #toolbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #layout {
    display: flex;
    margin-top: 44px;
  }
  #page-wrap {
    position: relative;
    margin: 16px;
  }
  #page-wrap img { display: block; }
  .overlay-layer { position: absolute; top: 0; left: 0; }
  .block {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.5);
    cursor: pointer;
  }
  .block:hover { background: rgba(255,255,255,0.15); }
  .block.headline { border-width: 2px; border-style: dashed; }
  .block.excluded { border-style: dotted; border-color: #888 !important; opacity: 0.5; }
  .col-line {
    position: absolute;
    top: 0;
    width: 0;
    border-left: 2px dashed rgba(255,255,0,0.7);
  }
  .article-box {
    position: absolute;
    border: 2px solid rgba(255,255,255,0.9);
    pointer-events: none;
  }
  .article-label {
    position: absolute;
    top: -1px;
    left: -2px;
    transform: translateY(-100%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 10px;
    padding: 1px 4px;
    white-space: nowrap;
    pointer-events: auto;
  }
  .image-box {
    position: absolute;
    border: 2px dashed orange;
  }
  #panel {
    position: sticky;
    top: 44px;
    width: 380px;
    height: calc(100vh - 44px);
    overflow-y: auto;
    padding: 16px;
    background: #1e1e1e;
    border-left: 1px solid #444;
    font-size: 13px;
    flex-shrink: 0;
  }
  #panel h3 { margin-top: 0; }
  #panel .meta { color: #9cf; margin-bottom: 8px; }
  #panel pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; }
  #panel .placeholder { color: #888; }
</style>
</head>
<body>
<div id="toolbar">
  <strong>Debug overview</strong>
  <label>page <select id="page-select"></select></label>
  <button id="prev-page">&larr; prev</button>
  <button id="next-page">next &rarr;</button>
  <label><input type="checkbox" id="toggle-blocks" checked> raw text blocks</label>
  <label><input type="checkbox" id="toggle-furniture"> excluded short blocks</label>
  <label><input type="checkbox" id="toggle-columns" checked> column boundaries</label>
  <label><input type="checkbox" id="toggle-articles" checked> articles</label>
  <label><input type="checkbox" id="toggle-images" checked> images</label>
</div>
<div id="layout">
  <div id="page-wrap"></div>
  <div id="panel"><span class="placeholder">Click a block or article label for details.</span></div>
</div>
<script>
const DATA = __DATA_JSON__;
let currentPageIdx = 0;

function colorFor(idx) {
  return `var(--col-${idx % 8})`;
}

function el(tag, attrs, parent) {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  if (parent) parent.appendChild(e);
  return e;
}

function showPanel(html) {
  document.getElementById('panel').innerHTML = html;
}

function blockPanelHtml(b) {
  return `<h3>Text block</h3>
    <div class="meta">columns ${(b.columns || []).join(',')} · article #${b.article_idx}</div>
    <div class="meta">font size ${b.font_size} (col median ${b.median_body_size})</div>
    <div class="meta">bold: ${b.is_bold} · italic: ${b.is_italic} · looks_like_headline: ${b.looks_like_headline}</div>
    <div class="meta">word count: ${b.word_count}${b.excluded_short ? ' · excluded from column clustering (too short)' : ''}</div>
    <pre>${escapeHtml(b.text)}</pre>`;
}

function articlePanelHtml(a) {
  return `<h3>Article #${a.article_idx}</h3>
    <div class="meta">columns ${a.columns.join(',')}</div>
    <div class="meta">headline guess: ${escapeHtml(a.headline_guess)}</div>
    <pre>${escapeHtml(a.text)}</pre>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function render() {
  const page = DATA.pages[currentPageIdx];
  showPanel('<span class="placeholder">Click a block or article label for details.</span>');

  const wrap = document.getElementById('page-wrap');
  wrap.innerHTML = '';
  wrap.style.width = page.width_px + 'px';
  wrap.style.height = page.height_px + 'px';

  const img = el('img', { src: page.image, width: page.width_px, height: page.height_px }, wrap);

  const blocksLayer = el('div', { className: 'overlay-layer', id: 'layer-blocks' }, wrap);
  const furnitureLayer = el('div', { className: 'overlay-layer', id: 'layer-furniture' }, wrap);
  for (const b of page.blocks) {
    const [x0, y0, x1, y1] = b.bbox;
    const div = el('div', { className: 'block' + (b.looks_like_headline ? ' headline' : '') + (b.excluded_short ? ' excluded' : '') }, b.excluded_short ? furnitureLayer : blocksLayer);
    div.style.left = x0 + 'px';
    div.style.top = y0 + 'px';
    div.style.width = (x1 - x0) + 'px';
    div.style.height = (y1 - y0) + 'px';
    div.style.borderColor = b.excluded_short ? '#888' : colorFor((b.columns && b.columns[0]) ?? 0);
    div.title = `cols ${(b.columns || []).join(',')} · article #${b.article_idx}\nfont ${b.font_size} (median ${b.median_body_size}) bold=${b.is_bold} italic=${b.is_italic}\nwords ${b.word_count}${b.excluded_short ? ' (excluded)' : ''}\nheadline guess: ${b.looks_like_headline}`;
    div.addEventListener('click', () => showPanel(blockPanelHtml(b)));
  }

  const colLayer = el('div', { className: 'overlay-layer', id: 'layer-columns' }, wrap);
  for (const x of page.column_boundaries_px) {
    const line = el('div', { className: 'col-line' }, colLayer);
    line.style.left = x + 'px';
    line.style.height = page.height_px + 'px';
  }

  const artLayer = el('div', { className: 'overlay-layer', id: 'layer-articles' }, wrap);
  for (const a of page.articles) {
    const [x0, y0, x1, y1] = a.bbox;
    const box = el('div', { className: 'article-box' }, artLayer);
    box.style.left = x0 + 'px';
    box.style.top = y0 + 'px';
    box.style.width = (x1 - x0) + 'px';
    box.style.height = (y1 - y0) + 'px';
    box.style.borderColor = colorFor(a.columns[0] ?? 0);
    const label = el('div', { className: 'article-label' }, box);
    label.textContent = `#${a.article_idx} cols=${a.columns.join(',')}: ${a.headline_guess}`.slice(0, 60);
    label.addEventListener('click', () => showPanel(articlePanelHtml(a)));
  }

  const imgLayer = el('div', { className: 'overlay-layer', id: 'layer-images' }, wrap);
  for (const im of page.images) {
    const [x0, y0, x1, y1] = im.bbox;
    const box = el('div', { className: 'image-box' }, imgLayer);
    box.style.left = x0 + 'px';
    box.style.top = y0 + 'px';
    box.style.width = (x1 - x0) + 'px';
    box.style.height = (y1 - y0) + 'px';
    box.title = `article #${im.article_idx}`;
  }

  applyToggleState();
}

const toggles = {
  'toggle-blocks': 'layer-blocks',
  'toggle-furniture': 'layer-furniture',
  'toggle-columns': 'layer-columns',
  'toggle-articles': 'layer-articles',
  'toggle-images': 'layer-images',
};

function applyToggleState() {
  for (const [checkboxId, layerId] of Object.entries(toggles)) {
    const checkbox = document.getElementById(checkboxId);
    const layer = document.getElementById(layerId);
    if (layer) layer.style.display = checkbox.checked ? '' : 'none';
  }
}

for (const checkboxId of Object.keys(toggles)) {
  document.getElementById(checkboxId).addEventListener('change', applyToggleState);
}

function setPage(idx) {
  currentPageIdx = Math.max(0, Math.min(DATA.pages.length - 1, idx));
  document.getElementById('page-select').value = String(currentPageIdx);
  render();
}

const pageSelect = document.getElementById('page-select');
for (const [idx, page] of DATA.pages.entries()) {
  const opt = el('option', { value: String(idx), textContent: `Page ${page.page_num}` }, pageSelect);
}
pageSelect.addEventListener('change', () => setPage(Number(pageSelect.value)));
document.getElementById('prev-page').addEventListener('click', () => setPage(currentPageIdx - 1));
document.getElementById('next-page').addEventListener('click', () => setPage(currentPageIdx + 1));

render();
</script>
</body>
</html>
