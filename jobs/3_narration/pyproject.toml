[project]
name = "hoerbote-narration"
version = "0.1.0"
description = "Narration job: turns an issue's articles into a spoken narration per page via an LLM."
requires-python = ">=3.14"
dependencies = [
    "hoerbote-shared",
    "python-dotenv>=1.2.0",
    "tenacity>=9.0.0",
    "google-genai>=2.25.0",
]

[tool.uv.sources]
# A path dependency, not a uv workspace: every project locks on its own.
hoerbote-shared = { path = "../../shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
include = ["*.py"]
