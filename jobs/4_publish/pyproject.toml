[project]
name = "hoerbote-publish"
version = "0.1.0"
description = "Publish job: reshapes articles + narration into frontend-ready JSON."
requires-python = ">=3.14"
dependencies = [
    "hoerbote-shared",
    # Page dimensions (for fractional bboxes) come straight from the
    # source PDF -- report.json doesn't record them.
    "pymupdf>=1.28.2",
    # WebP: pymupdf only writes PNG/JPEG etc.
    "pillow>=12.0",
]

[tool.uv.sources]
# A path dependency, not a uv workspace: every project locks on its own.
hoerbote-shared = { path = "../../shared" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
