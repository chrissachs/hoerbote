[project]
name = "hoerbote-audio"
version = "0.1.0"
description = "Audio job: renders a published issue's narration segments to MP3 (Gemini TTS, Batch API)."
requires-python = ">=3.14"
dependencies = [
    "hoerbote-shared",
    "google-genai>=2.25.0",
    # WAV from the TTS API -> MP3 (libsndfile >=1.1 has an MP3 encoder).
    "soundfile>=0.13.1",
    "python-dotenv>=1.2.0",
]

[tool.uv.sources]
# A path dependency, not a uv workspace: every project locks on its own.
hoerbote-shared = { path = "../../shared" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
