[project]
name = "hoerbote-audio"
version = "0.1.0"
description = "Audio job: renders a published issue's narration segments to Ogg Opus (Gemini TTS, or our own model on Modal)."
requires-python = ">=3.14"
dependencies = [
    "hoerbote-shared",
    "google-genai>=2.25.0",
    # Audio -> Ogg Opus (libsndfile).
    "soundfile>=0.13.1",
    "numpy>=2.3",
    # The model engine's GPU calls (qwen3_tts_gpu.py). Same version as the layout job's.
    "modal==1.6.1",
    "python-dotenv>=1.2.0",
]

[tool.uv.sources]
# A path dependency, not a uv workspace: every project locks on its own.
hoerbote-shared = { path = "../../shared" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
