[project]
name = "hoerbote-runner"
version = "0.1.0"
description = "Starts the pipeline's jobs in order, daily or for one run (see run.py)."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/*.py"]
