[project]
name = "hoerbote-shared"
version = "0.1.0"
description = "The on-disk data contracts between hoerbote's jobs and the backend."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Top-level modules only, not tests/.
include = ["/*.py"]
